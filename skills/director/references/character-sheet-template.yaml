# Character Sheet — Schema and Example (v1.1)
#
# A character sheet defines:
#   - base:                region-independent identity (hair, skin, eye color, face structure, age) — ALWAYS in prompt
#   - persistent_grooming: body-state attrs that persist across scenes (nail polish, tattoos, scars,
#                          makeup defaults) — ALWAYS considered, VGAI-gated by framing, suppressed by state.removes
#   - wardrobe_states:     NAMED situational outfits — exactly ONE chosen per shot
#   - mutex_groups:        pairs of attrs that cannot coexist in one shot
#
# Director LLM merges: base + persistent_grooming + (chosen wardrobe_state.items)
#                    - wardrobe_state.removes    → gives full attribute set
# Then VGAI-gates by framing → filtered set → final prompt.

schema:
  character:
    id: string
    base:
      - string
    persistent_grooming:                # attrs that travel with the character across states
      - attr: string
        anchor: string                  # face|ear|eye|neck|hand|torso|torso_back|leg|foot
        value: string
        # optional:
        visibility_through_hosiery: string   # how to phrase when layered under sheer fabric
        removable_by: [list_of_contexts]     # e.g., [showering, kissing, sleep] — metadata hint
    wardrobe_states:
      - id: string
        context: string
        items:
          - attr: string
            anchor: string
            value: string
            neckline_hint: string              # for torso-dropped face CU
            pose_variants: {front,back,profile}
        removes: [list_of_grooming_attrs]      # grooming suppressed by this state (e.g., lipstick wiped)
        mutex_locks: [notes]
    mutex_groups:
      - - string
        - string


# ---------------------------------------------------------------
# EXAMPLE: Su Wan
# ---------------------------------------------------------------

example_su_wan:
  id: su_wan

  base:
    - "28 years old"
    - "Chinese"
    - "long straight black hair parted to one side, falling to collarbone"
    - "fair skin"
    - "dark brown expressive eyes with long lashes"
    - "soft jawline"

  # ============================================================
  # PERSISTENT GROOMING — always present unless a state removes it
  # ============================================================
  persistent_grooming:

    - attr: red_fingernails
      anchor: hand
      value: "glossy red fingernail polish"
      removable_by: []   # always present

    - attr: red_toenails
      anchor: foot
      value: "glossy red toenail polish matching her fingernails"
      visibility_through_hosiery: "red toenail polish visible as a hint of color at the toe tips beneath the sheer stocking material"
      removable_by: []   # always present, even under hosiery

    - attr: red_lipstick
      anchor: face
      value: "bold red lipstick"
      removable_by: [showering, intimate_moment, sleeping_long]

    # Future grooming candidates (examples of the pattern):
    # - attr: waist_tattoo
    #   anchor: torso_back
    #   value: "small ink swallow tattoo at lower back right hip"
    # - attr: eyebrow_piercing
    #   anchor: face
    #   value: "small silver ring in left eyebrow"
    #
    # Grooming lives here ONCE. States toggle it via `removes`.

  # ============================================================
  # WARDROBE STATES — situational outfits, pick one per shot
  # Items listed here are CLOTHING/ACCESSORIES only. Grooming lives above.
  # ============================================================
  wardrobe_states:

    - id: work_formal
      context: "Public appearances, nightclub work, meeting strangers, thriller beats."
      items:
        - attr: jade_earring
          anchor: ear
          value: "small jade teardrop earring on her exposed ear"
          pose_variants:
            front: "jade teardrop earrings on both ears visible"
            profile: "jade teardrop earring on the visible ear"
            back: "jade teardrop earring glinting on her exposed left ear"
        - attr: black_dress
          anchor: torso
          value: "form-fitting black cocktail dress with thin straps"
          neckline_hint: "thin black dress strap visible at shoulder / dress neckline at bottom of frame"
        - attr: leg_pantyhose
          anchor: leg
          value: "sheer black pantyhose covering her legs from waist down"
        - attr: black_stiletto_heels
          anchor: foot
          value: "black stiletto heels covering her feet (toes hidden inside the shoe)"
      removes: []   # grooming all present

    - id: home_after_intimate
      context: "In his apartment after an intimate moment, partially dressed in his clothing. Not freshly showered."
      items:
        - attr: mens_open_shirt
          anchor: torso
          value: "oversized white men's dress shirt, open at chest, sleeves rolled messily"
          neckline_hint: "white shirt collar soft against her neck"
        - attr: leg_pantyhose
          anchor: leg
          value: "sheer black pantyhose covering her legs from waist down (still on)"
        - attr: stocking_toes
          anchor: foot
          value: "her feet still in the sheer black stocking material — five toes clearly outlined beneath the hosiery, red toenail polish showing through as hint of red at the toe tips. Continuous stocking over every toe, NOT bare skin on the feet."
      removes: [red_lipstick]   # kissed/smudged off

    - id: sleeping_at_his_place
      context: "Curled up asleep at his apartment, morning after. Vulnerable."
      items:
        - attr: mens_open_shirt
          anchor: torso
          value: "oversized white men's dress shirt, loosely covering her"
          neckline_hint: "white shirt draped at her shoulder"
        - attr: leg_pantyhose
          anchor: leg
          value: "sheer black pantyhose still on, covering her legs"
        - attr: stocking_toes
          anchor: foot
          value: "her feet in sheer black stockings — five toes clearly outlined beneath, red toenail polish showing through as hint of red. NOT bare skin, NOT bare toes."
      removes: [red_lipstick]   # smudged off overnight

    - id: bathing
      context: "In shower or bathtub. Water, steam. Naked."
      items: []   # no wardrobe
      removes: [red_lipstick]   # washed off
      # Grooming (red_fingernails, red_toenails) stays — polish is waterproof.
      mutex_locks:
        - "character is nude in water; torso/leg/foot wardrobe items are absent"

    - id: post_shower_towel
      context: "Just exited shower. Towel wrapped. Wet hair."
      items:
        - attr: white_towel
          anchor: torso
          value: "white cotton towel wrapped tight around her chest and torso"
      removes: [red_lipstick]   # washed off, not reapplied yet

    - id: running_action
      context: "Running, fighting, high-action. Simplified wardrobe."
      items:
        - attr: black_dress
          anchor: torso
          value: "form-fitting dark clothing allowing free motion"
        - attr: leg_pantyhose_torn
          anchor: leg
          value: "sheer black pantyhose, torn slightly from activity"
        - attr: stocking_toes
          anchor: foot
          value: "her feet in sheer black stockings, toes visible through hosiery"
      removes: []

  # ============================================================
  # Mutex groups — attrs that cannot coexist
  # ============================================================
  mutex_groups:
    - [stocking_toes, red_toenails_exposed]       # foot either in hosiery OR bare with visible polish — not both exposed
    - [stocking_toes, black_stiletto_heels]       # stocking_toes needs no shoe; heels cover foot
    - [leg_pantyhose, bare_legs]                  # leg either hosiered or bare
    # Note: red_toenails (grooming, always on) + stocking_toes (wardrobe, sometimes on) are NOT mutex —
    # they LAYER: grooming shows through hosiery via visibility_through_hosiery phrasing.


# ---------------------------------------------------------------
# Director LLM — attribute-assembly algorithm
# ---------------------------------------------------------------

director_algorithm:
  steps:
    - "0. Start with an empty attribute set. Load `base` into prompt preamble (always included, region-independent)."
    - "1. Load ALL of `persistent_grooming` into attribute candidates."
    - "2. Pick EXACTLY ONE `wardrobe_state` for this shot based on narrative context."
    - "3. Merge `wardrobe_state.items` into attribute candidates."
    - "4. Subtract any attrs listed in `wardrobe_state.removes` from the candidates (grooming suppressed by state)."
    - "5. Apply VGAI: filter candidates by framing's visible_regions (keep attr IFF attr.anchor ∈ visible_regions)."
    - "6. Check mutex_groups: if two filtered attrs are in the same mutex group, pick one based on shot intent."
    - "7. For face-dominant framings (cu_face, ear_cu) where torso is dropped: include neckline_hint from dropped torso attr."
    - "8. For profile/back framings: swap attr.value with pose_variants[front|back|profile] if defined."
    - "9. Assemble final prompt: ANIME_PREAMBLE + base + pose + scene + framing_directive + filtered_attrs."

  rules:
    - "persistent_grooming is always considered, never defaulted to absence. If missing from final prompt, it's because VGAI gated it out (anchor not in framing) or state.removes suppressed it — both are explicit, not forgetful."
    - "When a grooming attr has `visibility_through_hosiery`, USE that phrasing if a layered wardrobe attr (stocking, gloves, etc.) is also injected over the same region."
    - "Do NOT invent attributes. If the story demands something not in the sheet, either (a) add it to the sheet first, or (b) describe inline in the pose field acknowledging it's ad-hoc."
    - "Do NOT use 'her signature look' — there is no default. Always pick a named wardrobe_state."
