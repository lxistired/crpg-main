[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crpg"
version = "0.1.0"
description = "Creator CLI for interactive branching noir fiction with anime image generation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx >= 0.27",
    "pydantic >= 2.5",
    "click >= 8.1",
    "python-dotenv >= 1.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
    "pytest-httpx >= 0.30",
    "pytest-cov >= 5.0",
    "ruff >= 0.4",
]

[project.scripts]
crpg = "crpg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crpg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
