                    - paragraph [ref=e1300]: "林晓在备餐区拦住{{playerName}}，声音压得很低：「你知道他今天来是干什么的吗？」他从围裙口袋里掏出一张便利贴，上面是陈默点单时随手写下的地址——搬家公司的电话和一个外地城市的名字。「方婶说他下周走，今天是来道别的。」林晓把便利贴塞进{{playerName}}手里，「你刚才那出戏，他全看见了。」"
