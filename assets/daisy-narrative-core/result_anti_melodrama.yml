                    - generic [ref=e1289]: 叙事
                    - paragraph [ref=e1290]: "{{playerName}}抓住林晓的手肘，把他拉进吧台后的备餐区，压低声音说认错人了别乱说。林晓皱眉，但没有坚持。两人回到大厅时，陈默已经重新坐好，手里转着那枚书签，表情平静。「朋友？」他问。「同事，」{{playerName}}说，「爱说话的那种。」陈默笑了一下，点头，把书签放进上衣口袋。那个动作很慢，像是在做一个决定。"
