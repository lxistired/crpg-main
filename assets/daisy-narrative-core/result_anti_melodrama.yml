                - group [ref=e1173]:
                  - generic [ref=e1177]:
                    - text: 结局正面
                    - paragraph [ref=e1178]: "{{playerName}}八点四十分到的。咖啡厅还没开门，就站在玻璃门外等。 陈默来的时候看见{{playerName}}，脚步停了一下。 「我有话先说。」{{playerName}}开口，声音比预想的平稳，「三年前是我的错。不是时机不对，是我太怕了。我现在还是怕，但我不想再用怕当借口。」 陈默没有说话。他低下头，用手背擦了一下眼角，然后抬起来看{{playerName}}。 「那张书签，」他说，「我带了三年了。」 方婶开门的钥匙声响起来，两个人都没动。"
                - group [ref=e1179]:
                  - generic [ref=e1183]:
                    - text: 结局反讽
                    - paragraph [ref=e1184]: "陈默九点整推开玻璃门，在{{playerName}}对面坐下，把书签放到桌上。 「我想清楚了，」他说，语气很平，「我现在给不了你一个完整的人。父母的事我还没处理好，我不想带着那些东西靠近你。」 {{playerName}}看着书签，没有接。 「所以这是道别？」 「是暂别。」他顿了顿，「但我没有资格让你等。」 他起身，把书签推到{{playerName}}面前，拿起外套。玻璃门开了又关，雨已经停了，地面还是湿的。"
                - group [ref=e1185]:
                  - generic [ref=e1189]:
                    - text: 结局负面
                    - paragraph [ref=e1190]: "陈默把咖啡杯转了半圈，等{{playerName}}说话。 窗外有人撑伞经过，雨声填满了沉默。{{playerName}}想过很多种开口的方式，此刻全部卡在喉咙里，一个字也出不来。 「没事，」陈默最后说，站起来，「我知道了。」 他没有解释「知道了」是什么意思。结账，穿外套，推开玻璃门。{{playerName}}坐在原位，看着他走进人群，背影很快就看不见了。 杯子里的咖啡还有半杯，凉的。"
                - group [ref=e1191]:
                  - generic [ref=e1195]:
                    - generic [ref=e1197]: 叙事
                    - paragraph [ref=e1198]: "陈默把书签翻过来看了看，然后安静地收回手里。 「抱歉，」他微微笑了一下，「可能认错人了。」 那个笑容没有追问，没有戳破，给了{{playerName}}一条完整的退路。{{playerName}}点头，把杯子重新端起来，手已经不抖了。 雨还在下。书签消失进陈默的外套口袋，两个人之间的桌面空了出来，干干净净，像什么都没发生过。"
                    - generic [ref=e1199]: +value → +value
                - group [ref=e1201]:
                  - generic [ref=e1205]:
                    - generic [ref=e1207]: 叙事
                    - paragraph [ref=e1208]: "陈默将书签收回口袋，伸出右手：「那就重新认识一下。陈默，在这家店喝了三年咖啡的普通客人。」 {{playerName}}盯着那只手停了一秒，握上去：「……初次见面。」 两人各自报了名字，各自说了些无关紧要的话——喜欢哪种豆子，天气真的很糟。桌上的咖啡续了一杯，对话流畅得像排练过。方婶从柜台后面瞥了一眼，转身去擦杯子，没说话。这场戏的布景很好，只是台词全是假的。"
