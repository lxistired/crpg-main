                    - paragraph [ref=e1377]: "{{playerName}}盯着那条消息看了很久，屏幕的亮度自动调暗，又调暗一次。最后回复了两个字：不去。陈默没有再发消息。三天后，方婶在咖啡厅门口贴了一张手写的便条，说靠窗那张桌子的常客搬走了，祝他一路顺风。林晓把便条拍了照片发给{{playerName}}，没有附任何文字。那杯三年前没喝完的咖啡，{{playerName}}当时以为还有机会续杯。玻璃窗还是那扇玻璃窗，下雨的时候照样起雾，只是倒影里只剩一个人。"
