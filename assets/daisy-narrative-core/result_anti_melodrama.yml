              - generic:
                - group [ref=e213]:
                  - generic [ref=e217]:
                    - generic [ref=e219]: 叙事
                    - paragraph [ref=e220]: "雨下得不大，但够让玻璃窗起雾。{{playerName}}在靠墙的位置坐了四十分钟，咖啡已经凉了一半，手机屏幕也暗了。这家咖啡厅每逢雨天都会放同一张爵士碟，{{playerName}}早就背下了曲序。角落里有人移动椅子——那声音不响，但{{playerName}}抬起头。深蓝色的外套，左肩的线缝处有一道细小的磨损。{{playerName}}认识那道磨损。手指停在咖啡杯把上，没有动。"
                    - generic [ref=e221]: +value → +value
                - group [ref=e939]:
                  - generic [ref=e943]:
                    - generic [ref=e944]:
                      - generic [ref=e945]: 叙事
                      - generic "激励事件" [ref=e946]: ★
                    - paragraph [ref=e947]: "三年前也是这家咖啡厅，靠近窗的那张桌子。{{playerName}}把写好的字条叠了又叠，最后推到陈默面前。陈默看了很久，然后说：「我需要一点时间。」那是他说的最后一句话。此后的消息越来越短，直到某天开始不再回复。{{playerName}}以为时间会把这件事磨成一个模糊的轮廓，像旧照片褪色那样。但此刻隔着半个咖啡厅看着那道磨损的线缝，{{playerName}}发现那张字条的每个折痕都还在。"
                    - generic [ref=e948]: +value → +value
                - group [ref=e950]:
                  - generic [ref=e954]:
                    - text: 检定
                    - generic [ref=e955]:
                      - generic [ref=e956]: 镇定
                      - generic [ref=e957]: DC 12
                    - generic [ref=e958]:
                      - generic [ref=e961]: ● 成功
                      - generic [ref=e963]: ● 失败
                - group [ref=e967]:
                  - generic [ref=e971]:
                    - generic [ref=e973]: 叙事
                    - paragraph [ref=e974]: "碎碟的碎片散在桌角，{{playerName}}没有去捡，只是用餐巾纸盖住。瓷片的截面是白色的，光打在上面，映出一小块模糊的倒影——{{playerName}}的轮廓，以及更远处，陈默的方向。{{playerName}}没有抬头，但余光里，陈默的视线在这张桌子停了三秒。然后他收回目光，重新看向窗外的雨。三秒。{{playerName}}数清楚了。"
                    - generic [ref=e975]: +value → +value
                - group [ref=e977]:
                  - generic [ref=e981]:
                    - generic [ref=e983]: 叙事
                    - paragraph [ref=e984]: "林晓蹲下来收拾碎碟，嘴里说着「没关系没关系」，声音足够让旁边几桌都听见。{{playerName}}抽了三张纸巾，不知道该先擦袖口还是先擦桌子。这时候有人走过来，把一叠干净的餐巾纸放在桌上。「要紧吗？」陈默站在桌边，语气像是在问一个陌生人。{{playerName}}抬起头，和他对视了不到一秒。「没事，谢谢。」声音比预想的稳。"
                    - generic [ref=e985]: +value → +value
                - group [ref=e987]:
                  - generic [ref=e993]:
                    - text: 合流
                    - paragraph [ref=e994]: 合流
                    - generic [ref=e995]:
                      - button "−" [ref=e996]
                      - generic [ref=e997]: "3"
                      - button "+" [ref=e998]
                - group [ref=e1000]:
                  - generic [ref=e1004]:
                    - text: 抉择
                    - paragraph [ref=e1005]: "那行字是{{playerName}}三年前写的，笔迹没有变。书签压在桌上，像一张没有署名的账单。 陈默的手放在桌沿，没有催促，也没有解释为什么把它保存到现在。 承认，意味着三年前的那个下午需要被重新打开。不承认，这张书签就只是一件遗失物，陌生人归还，陌生人道谢，然后各自离开。 雨打在玻璃窗上，声音细碎。"
                    - list [ref=e1006]:
                      - listitem [ref=e1007]:
                        - generic [ref=e1008]: A
                        - generic [ref=e1009]: "【坦诚之路】{{playerName}}承认认出书签，主动提起三年前的往事"
                      - listitem [ref=e1010]:
                        - generic [ref=e1011]: B
                        - generic [ref=e1012]: "【伪装之路】{{playerName}}假装不记得，将书签当作陌生物品归还"
                - group [ref=e1015]:
                  - generic [ref=e1019]:
                    - text: 幕间
                    - paragraph [ref=e1020]: "无论说了什么，那句话已经出口，或者那张书签已经被推回去。 咖啡厅里有人结账离开，门开了一道缝，雨声灌进来，又被关上。玻璃窗上，{{playerName}}和陈默的轮廓被雨水拉成同一道模糊的影子，分不清边界。 有些事说出口就无法假装没说过。有些东西一旦还出去，就再也不属于自己。 第一幕到此为止。"
                - group [ref=e1022]:
                  - generic [ref=e1026]:
                    - generic [ref=e1028]: 叙事
                    - paragraph [ref=e1029]: "陈默没有立刻回应。他低头看了一眼桌上的书签，用拇指摩挲了一下边角。 「我一直带着它，」他说，「不是因为忘不掉。是因为——」他停了一下，「觉得还没结束。」 他抬起头，鼻梁上方有一点红，像是在冷风里站过太久。 {{playerName}}第一次意识到，这三年不是只有自己在数。"
                    - generic [ref=e1030]: +value → +value
                - group [ref=e1032]:
                  - generic [ref=e1036]:
                    - generic [ref=e1038]: 叙事
                    - paragraph [ref=e1039]: "方婶从吧台后面走出来，往两人桌上补了两杯热水，顺口说：「小陈啊，你这个位置今天终于有人陪了。」 陈默没说话。 方婶擦着手，对{{playerName}}说：「他每个礼拜五都来，坐这里，点一杯美式，坐到打烊。我以为是等外卖，后来才知道——」她顿了顿，看了陈默一眼，「算了，我多嘴。」 她转身回了吧台。陈默把手里的杯子转了半圈，没有解释，也没有否认。"
                    - generic [ref=e1040]: +value → +value
                - group [ref=e1042]:
                  - generic [ref=e1046]:
                    - text: 抉择
                    - paragraph [ref=e1047]: "陈默把咖啡杯转了半圈，开口时声音很平。「我爸妈离婚那年我十六岁。我以为只要不开口，就不会有人受伤。」他没有看{{playerName}}，视线落在桌面的木纹上。「后来我才明白，沉默也是一种伤害。」窗外雨声填满了两人之间的空白。这是他第一次把这件事说出口，说完之后他端起杯子喝了一口，像是要用动作盖过那句话的重量。{{playerName}}面对的选择只有两个：用自己的伤口去接住他的，或者安静地守在这里，让他的话有地方落下。"
                    - list [ref=e1048]:
                      - listitem [ref=e1049]:
                        - generic [ref=e1050]: A
                        - generic [ref=e1051]: "{{playerName}}分享自己的旧伤，以真实换真实"
                      - listitem [ref=e1052]:
                        - generic [ref=e1053]: B
                        - generic [ref=e1054]: "{{playerName}}选择倾听，将空间留给陈默的痛苦"
                - group [ref=e1057]:
                  - generic [ref=e1061]:
                    - generic [ref=e1063]: 叙事
                    - paragraph [ref=e1064]: "{{playerName}}盯着桌上的书签说：「我前任在我们交往的最后半年里，一直在和别人联系。我是最后一个知道的。」话说出口比预想的容易，也比预想的疼。「所以我也学会了不先开口。」陈默没有说「我懂」，也没有说「对不起」。他把书签翻了个面，指着背面一行褪色的字：那是当年两人约定的句子，{{playerName}}自己写的。咖啡厅的玻璃窗蒙着水雾，外面的路灯只剩一团模糊的光。两个人的旧伤第一次被放在同一张桌子上，没有人急着收走。"
                    - generic [ref=e1065]: +value → +value
                - group [ref=e1067]:
                  - generic [ref=e1071]:
                    - text: 检定
                    - generic [ref=e1072]:
                      - generic [ref=e1073]: 洞察
                      - generic [ref=e1074]: DC 14
                    - generic [ref=e1075]:
                      - generic [ref=e1078]: ● 成功
                      - generic [ref=e1080]: ● 失败
                - group [ref=e1084]:
                  - generic [ref=e1088]:
                    - generic [ref=e1090]: 叙事
                    - paragraph [ref=e1091]: "苏哲走后，陈默把手收回去，拇指摩挲着书签的边缘。「他说的那个人是他自己暗恋的对象，」他说，「他一直觉得我抢了他的位置。」他没有解释更多，也不需要。{{playerName}}刚才没有顺着苏哲的话走，陈默看在眼里。他把手放到桌上，掌心朝上，没有说话。这不是一个要求，是一个等待。{{playerName}}把手覆上去，两个人都看着窗外，雨小了一些，能看清对面街道的招牌了。"
                    - generic [ref=e1092]: +value → +value
                - group [ref=e1094]:
                  - generic [ref=e1098]:
                    - generic [ref=e1100]: 叙事
                    - paragraph [ref=e1101]: "陈默沉默了几秒，然后把书签翻过来，字朝下放着。「你要是想知道，我可以解释。」「那你解释。」{{playerName}}的语气比想象中直接。「苏哲说的那段时间，我确实在联系一个人，但不是你以为的那种关系。」「那是哪种？」陈默看了{{playerName}}一眼，没有继续说。窗外有人撑着伞跑过去，雨点打在玻璃上。两个人之间的空气和刚才不一样了，像是翻了一页，但翻到了空白处。"
                    - generic [ref=e1102]: +value → +value
                - group [ref=e1104]:
                  - generic [ref=e1108]:
                    - generic [ref=e1110]: 叙事
                    - paragraph [ref=e1111]: "陈默说完父母的事，抬头看向{{playerName}}。 沉默。 {{playerName}}没有开口——不是不想，是那些话卡在喉咙里，找不到出口。陈默等了几秒，将书签从桌上收回，叠好，塞进外套口袋。 「没事，」他说，声音很平，「我就是想说一声。」 他推开椅子站起来，动作整齐，像是早就预备好这个结局。窗外雨还在下，他转身去拿搭在椅背上的伞。"
                    - generic [ref=e1112]: +value → +value
                - group [ref=e1114]:
                  - generic [ref=e1118]:
                    - text: 检定
                    - generic [ref=e1119]:
                      - generic [ref=e1120]: 表达
                      - generic [ref=e1121]: DC 13
                    - generic [ref=e1122]:
                      - generic [ref=e1125]: ● 成功
                      - generic [ref=e1127]: ● 失败
                - group [ref=e1131]:
                  - generic [ref=e1135]:
                    - generic [ref=e1137]: 叙事
                    - paragraph [ref=e1138]: 陈默站在门口，背对着咖啡厅。 他没有立刻转身，只是低着头，伞的尖端抵在地板上。然后他回来了，重新坐下，把伞靠在椅子旁边。他没有擦眼睛，只是看着桌面。 「你刚才那句话，」他说，「我以为我不会再听到有人这样说。」 窗外雨声把咖啡厅里的背景音都盖住了。方婶默默换了两杯热水，没有多问。两人重新坐定，这次椅子之间的距离近了一些。
                    - generic [ref=e1139]: +value → +value
                - group [ref=e1141]:
                  - generic [ref=e1145]:
                    - generic [ref=e1147]: 叙事
                    - paragraph [ref=e1148]: "玻璃门关上的声音很轻。 陈默打开伞，走进雨里，没有回头。{{playerName}}隔着玻璃看他的背影缩小，直到拐过街角消失。 方婶过来收拾桌上的杯子，顺手把陈默那杯没喝完的咖啡端走。桌面留下一个浅浅的圆形水痕。 {{playerName}}还坐在原位。那句话其实早就想好了，只是没有说出来。"
                    - generic [ref=e1149]: +value → +value
                - group [ref=e1151]:
                  - generic [ref=e1155]:
                    - text: 幕间
                    - paragraph [ref=e1156]: "九点半，方婶开始关灯。咖啡厅从里到外一格一格暗下去，最后只剩吧台上方一盏小灯。 「我要锁门了，」方婶说，语气里没有催促，「明天还开。」 不管此刻坐着一个人还是两个人，天亮之前都要给出一个答案。雨还没停，玻璃窗上什么都映不清楚了。{{playerName}}站起来，拿上外套。门外的街灯把积水照得发亮。"
                - group [ref=e1158]:
                  - generic [ref=e1162]:
                    - text: 抉择
                    - paragraph [ref=e1163]: "手机屏幕在清晨六点四十七分亮起。陈默的消息只有一行：「咖啡厅，九点，我有些话想说，你愿意来吗？」 {{playerName}}盯着那个问号，窗外的天色还没完全亮透。昨晚的对话、那张书签、方婶关灯时说的「别想太久」，全部压在这一行字上。 九点。还有两个小时。"
                    - list [ref=e1164]:
                      - listitem [ref=e1165]:
                        - generic [ref=e1166]: A
