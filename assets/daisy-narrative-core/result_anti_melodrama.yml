                    - generic [ref=e1279]: 叙事
                    - paragraph [ref=e1280]: "「你只需要说一句话，」陈默把书签竖在桌上，语气平得像在念账单，「当年为什么没说出口。」{{playerName}}张了张嘴，说了半句「因为……」就停下来。沉默拉长。陈默将书签折进口袋，拉链声很轻。「没关系，」他说，站起来整理外套，「我只是想确认一下。」他去柜台结账，背对着{{playerName}}，没有再回头。"
