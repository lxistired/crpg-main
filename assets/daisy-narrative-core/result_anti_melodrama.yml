                    - paragraph [ref=e1365]: "【伪装·破茧结局】{{playerName}}将信递给陈默，陈默读完后将书签夹入信中还给{{playerName}}，两人在咖啡厅重新开始"
                - group [ref=e1366]:
                  - generic [ref=e1370]:
                    - text: 结局暧昧
                    - paragraph [ref=e1371]: "陈默已经到了，坐在靠窗那张桌子，书签压在咖啡杯下。{{playerName}}把信放到桌上，没说话。他展开读完，折好，重新夹进书签，推回来。「我等的不是这个，」他说，「我只想听你叫我一声名字，用你自己的声音。」窗外的街道是平日的样子，有人撑伞，有人不撑。{{playerName}}叫了他的名字。陈默点头，叫了{{playerName}}的名字作为回应。方婶从柜台后面端来两杯新的咖啡，什么都没问。两个人重新坐定，像是在填一张表格的第一栏——姓名，关系：朋友，日期：今天。"
                - group [ref=e1372]:
