  lighting: "simplified cel-shade (hard shadow edge), limited shade steps, rim-light for emphasis"
  composition: "anime-storyboard inheritance, speed lines, dynamic angles, diagonal cuts, character-centered"
  texture: "flat color fills, clean ink line, no visible brush, animation-cel quality, background painterly"
  typical_subjects: ["stylized characters in urban/school/fantasy settings", "animated-scene tableau"]
  typical_actions: ["TV-style moment framing", "dynamic action or still dramatic poses"]
  mood: "anime-iconic, energetic or introspective, genre-fluent"
