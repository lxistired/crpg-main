# Visual Aesthetic Axes — Taxonomy for crpg adult narrative platform
# ------------------------------------------------------------------
# Scope: visual-language classification, NOT explicit-content taxonomy.
# Each entry describes a distinct aesthetic "dialect" that an AI image
# generator can target. Categories are orthogonal to narrative content;
# they describe HOW a scene looks, not WHAT happens in it.
#
# Schema:
#   code, display_name_cn, display_name_en
#   palette, lighting, composition, texture
#   typical_subjects, typical_actions, mood
#   affinity_narrative_genres  (McKee-style narrative codes, see doc)
#   ai_model_recommendations   (provider-agnostic, 2-3 options)
#   prompt_template_skeleton
#   visual_forbidden           (what NOT to include)
#   reference_works            (public-facing artists/films/magazines
#                               — aesthetic reference only)
#   example_prompts
#   research_confidence        (high / medium / low)
# ------------------------------------------------------------------

version: "2026-04-17"
schema_version: 1
category_count: 6
entry_count: 24

# =============================================================
# CATEGORY 1 — Japanese Photorealistic (JP-R)
# =============================================================
# Cultural root: JAV industry conventions (1980s AV boom), gravure
# photography (weekly magazine culture), Japanese cinema "aesthetics
# of shadow" (Tanizaki, Ozu, Mizoguchi heritage). Visual DNA: muted
# palette, restrained framing, naturalistic skin, strong subtext.
# -------------------------------------------------------------

- code: jpr_urban_ol
  display_name_cn: 日系都市OL风
  display_name_en: Japanese Urban Office Lady
  palette: "muted beige, charcoal gray, navy, soft warm window light with occasional cool fluorescent accents; low saturation overall"
  lighting: "daylight through blinds producing horizontal slat shadows; soft window light; single practical light (desk lamp) at night; subtle fall-off"
  composition: "medium shot to close-up; centered or rule-of-thirds subject; shallow depth of field (f/1.8-2.8 feel); claustrophobic interior"
  texture: "fine film grain, smooth skin with subtle pore detail, fabric wrinkle (polyester suit), surface reflections on glass/laminate"
  typical_subjects: ["woman in office wear", "corporate interior", "hotel room", "stairwell", "parked car interior"]
  typical_actions: ["composed professional demeanor dissolving into intimacy", "after-hours encounters", "moment of hesitation captured mid-gesture"]
  mood: "restrained, loaded with subtext, realist, slightly melancholic"
  affinity_narrative_genres: ["forbidden_affair", "power_dynamic", "routine_with_twist", "secret_life"]
  ai_model_recommendations:
    - provider: "civitai/local"
      model_or_checkpoint: "Beautiful Realistic Asians (BRA) v7 / Japanese Style Realistic (JSR) v2"
      lora_or_embedding: ["office_lady", "japanese_skin_texture", "window_light"]
      notes: "BRA lineage is default industry standard for this look; check license (most allow commercial with attribution but NSFW redistribution varies)"
    - provider: "fal.ai / replicate"
      model_or_checkpoint: "FLUX dev fine-tune (japanese_realistic) or SDXL base + realistic LoRA"
      lora_or_embedding: ["jav_style_lighting"]
      notes: "FLUX has cleaner skin but weaker at JAV-specific framing; SDXL realistic ecosystem is more tuned for this subgenre"
    - provider: "local SDXL"
      model_or_checkpoint: "RealVisXL v5 + Asian portrait LoRA"
      lora_or_embedding: ["ArienMixXL Asian portrait"]
      notes: "More permissive license; weaker at JAV lighting unless LoRA-guided"
  prompt_template_skeleton: |
    A Japanese [age] woman in [office wear detail], [pose/action],
    [location: corporate office / hotel / apartment interior],
    [time of day] window light through blinds, shallow depth of field,
    muted palette, 35mm film grain, photorealistic,
    cinematic composition, natural skin texture
  visual_forbidden: ["high-saturation anime colors", "exaggerated anatomy", "Western skin-tone fallback", "stage-lit beauty-dish highlights", "fantasy attire"]
  reference_works: ["weekly gravure magazines (FRIDAY, FLASH — aesthetic only)", "Hirokazu Kore-eda interior cinematography", "Ryusuke Hamaguchi 'Drive My Car' apartment scenes", "Shunji Iwai early work"]
  example_prompts:
    - "Japanese woman late 20s in charcoal pencil skirt suit, unbuttoned collar, seated on edge of hotel bed, evening window light, blinds shadow across face, 35mm, shallow DoF, muted palette"
    - "Empty Japanese corporate meeting room, fluorescent lights half-off, single figure at window, golden hour spill, film grain"
  research_confidence: high

